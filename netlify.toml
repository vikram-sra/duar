[build]
  command = "npm run build"
  publish = "dist"

# Artwork and models are content, not code: the filename changes when the work
# changes, so they can be cached hard. Without this Netlify serves everything as
# `max-age=0, must-revalidate`, which makes a returning visitor revalidate every
# painting and the sculpture before any art appears.
[[headers]]
  for = "/portfolio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/textures/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Vite fingerprints these, so the filename already encodes the version.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The manifest is how new work reaches the site, and index.html is how new code
# does. Both must stay revalidating or a visitor can be pinned to an old gallery.
[[headers]]
  for = "/portfolio/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
